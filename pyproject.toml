[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "irbd-plasma-mirna"
version = "1.0.0"
description = "Statistical analysis of plasma microRNA sequencing in iRBD, de novo Parkinson's disease and healthy controls"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ahmed Hemedan" }]
keywords = ["microRNA", "DESeq2", "REM sleep behaviour disorder", "Parkinson's disease", "biomarkers"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: R",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/a7med7emedan/irbd-plasma-mirna"
Issues = "https://github.com/a7med7emedan/irbd-plasma-mirna/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
irbd-mirna = "irbdmirna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
irbdmirna = ["r/*.R", "resources/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the full pipeline and needs Rscript with DESeq2, edgeR and apeglm"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "NPY"]
ignore = ["E501"]
